name: Build Android APK with Bubblewrap

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
     - name: Build Android Project & APK
        run: |
          set -e

          echo "Java version:"
          java -version

          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo "Initializing Bubblewrap project..."

          bubblewrap init \
            --manifest=https://tahidultech.github.io/tat-cloud-manager/manifest.json \
            --directory=android-app \
            --javaHome="$JAVA_HOME"

          echo "Bubblewrap project created."

          cd android-app

          echo "Building APK..."

          bubblewrap build \
            --skipValidation

          echo "Generated APK files:"
          find . -type f -name "*.apk" -print

      - name: Upload Generated APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TAT-Manager-Android-APK
          path: |
            android-app/app/build/outputs/apk/release/*.apk
            android-app/**/*.apk
          if-no-files-found: error