name: Build Android APK with Bubblewrap

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: |
          npm install -g @bubblewrap/cli
          bubblewrap --version
          java -version

      - name: Build Android Project & APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          set -e

          echo "Using Java:"
          java -version

          echo "Initializing Bubblewrap project..."

          # Bubblewrap asks whether it should install its own JDK.
          # Answer "n" because GitHub Actions already provides JDK 17.
          printf "n\n" | bubblewrap init \
            --manifest=https://tahidultech.github.io/tat-cloud-manager/manifest.json \
            --directory=android-app

          echo "Bubblewrap project created successfully."

          cd android-app

          echo "Building APK..."
          bubblewrap build --skipValidation

          echo "APK files:"
          find . -type f -name "*.apk" -print

      - name: Upload Generated APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TAT-Manager-Android-APK
          path: |
            android-app/app/build/outputs/apk/release/*.apk
            android-app/**/*.apk
          if-no-files-found: error