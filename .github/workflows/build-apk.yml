name: Build Android APK with Bubblewrap

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Build Android Project & APK
        run: |
          # নন-ইন্টারঅ্যাক্টিভ মোডে প্রোজেক্ট জেনারেট ও বিল্ড করা
          bubblewrap init --manifest=https://tahidultech.github.io/tat-cloud-manager/manifest.json --directory=android-app || true
          cd android-app
          bubblewrap build --skipValidation

      - name: Upload Generated APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TAT-Manager-Android-APK
          path: |
            android-app/app/build/outputs/apk/release/*.apk
            android-app/**/*.apk

