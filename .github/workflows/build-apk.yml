name: Build Android APK with Bubblewrap

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Detect Android SDK
        shell: bash
        run: |
          set -e

          echo "JAVA_HOME=$JAVA_HOME"

          SDK=""

          for candidate in \
            "${ANDROID_HOME:-}" \
            "${ANDROID_SDK_ROOT:-}" \
            "/opt/android-sdk" \
            "/usr/local/lib/android/sdk" \
            "$HOME/Android/Sdk"; do

            if [ -n "$candidate" ] && [ -d "$candidate" ] && [ -d "$candidate/build-tools" ]; then
              SDK="$candidate"
              break
            fi
          done

          if [ -z "$SDK" ]; then
            echo "Android SDK not found."
            echo "Searching for sdkmanager..."

            find /opt /usr/local "$HOME" \
              -type f \
              -name sdkmanager \
              2>/dev/null | head -20

            exit 1
          fi

          echo "Android SDK: $SDK"
          echo "ANDROID_SDK_PATH=$SDK" >> "$GITHUB_ENV"

      - name: Install Bubblewrap
        run: |
          npm install -g @bubblewrap/cli
          npm list -g @bubblewrap/cli --depth=0

      - name: Configure Bubblewrap
        run: |
          set -e

          bubblewrap updateConfig \
            --jdkPath "$JAVA_HOME" \
            --androidSdkPath "$ANDROID_SDK_PATH"

          cat "$HOME/.bubblewrap/config.json"

      - name: Verify Bubblewrap
        run: |
          set -e
          bubblewrap doctor

      - name: Create Android Project
        run: |
          set -e

          rm -rf android-app
          mkdir -p android-app

          cat > android-app/twa-manifest.json <<'EOF'
          {
            "manifestVersion": "1",
            "name": "TAT Cloud & Accounts Manager",
            "shortName": "TAT Manager",
            "applicationId": "com.tahidul.tatcloudmanager",
            "hostName": "tahidultech.github.io",
            "startUrl": "/tat-cloud-manager/",
            "iconUrl": "https://tahidultech.github.io/tat-cloud-manager/icon/icon.png",
            "maskableIconUrl": "https://tahidultech.github.io/tat-cloud-manager/icon/icon.png",
            "displayMode": "standalone",
            "themeColor": "#4f46e5",
            "navigationColor": "#0f172a",
            "navigationColorDark": "#0f172a",
            "backgroundColor": "#0f172a",
            "fallbackType": "customtabs",
            "orientation": "default",
            "minSdkVersion": 21,
            "appVersionCode": 1,
            "appVersion": "1.0.0",
            "enableNotifications": true,
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "additionalTrustedOrigins": [],
            "shortcuts": []
          }
          EOF

          cd android-app

          bubblewrap update \
            --manifest=twa-manifest.json \
            --skipVersionUpgrade

      - name: Build APK with Gradle
        working-directory: android-app
        run: |
          set -e

          chmod +x gradlew

          ./gradlew assembleRelease

          echo ""
          echo "APK files:"
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TAT-Manager-Android-APK
          path: |
            android-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error