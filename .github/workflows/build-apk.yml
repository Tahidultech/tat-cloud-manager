name: Build PWA Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build Android App Package (PWA Builder Action)
        uses: pwa-builder/pwabuilder-action@main
        with:
          url: https://tahidultech.github.io/tat-cloud-manager/
          outputFolder: android-output
          platforms: android

      - name: Upload Generated APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TAT-Manager-Android-APK
          path: android-output/**/*.apk
