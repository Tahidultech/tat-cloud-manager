name: Generate Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Bubblewrap (PWABuilder Android Tool)
        run: npm install -g @bubblewrap/cli

      - name: Verify Environment
        run: bubblewrap --version

      - name: Build Android Package info
        run: echo "PWA configuration ready for APK packaging."

      - name: Upload Workspace Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TAT-Manager-PWA-Source
          path: index.html
