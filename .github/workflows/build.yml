      - name: Build APK from twa-manifest.json (no init)
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: "123456"
          BUBBLEWRAP_KEY_PASSWORD: "123456"
        run: |
          rm -rf ./twa
          mkdir -p ./twa
          cp ./twa-manifest.json ./twa/twa-manifest.json
          # keystore আগে থেকে বানিয়ে দাও, তাহলে First/Last name প্রশ্ন আসবে না
          keytool -genkeypair -v -keystore ./twa/android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=TAT Cloud, OU=Dev, O=TAT, L=Dhaka, S=Dhaka, C=BD"
          cd twa
          npx bubblewrap update --skipVersionUpgrade
          npx bubblewrap build