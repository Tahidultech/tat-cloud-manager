name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-33" "build-tools;33.0.1"

      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/bin" || true

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Build APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: "123456"
          BUBBLEWRAP_KEY_PASSWORD: "123456"
        run: |
          rm -rf ./twa
          mkdir -p ./twa
          npx bubblewrap init --manifest https://tahidultech.github.io/tat-cloud-manager/manifest.json --directory ./twa
          cd twa
          npx bubblewrap build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tat-cloud-manager-apk
          path: twa/app/build/outputs/apk/release/*.apk