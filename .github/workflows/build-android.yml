name: Build APK from PWA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Build APK
        run: |
          # তোমার PWA টা আগে GitHub Pages এ publish করতে হবে
          # Settings > Pages > Deploy from main branch on করে নাও
          npx bubblewrap init --manifest https://tahidultech.github.io/tat-cloud-manager/manifest.json --directory ./twa
          cd twa
          npx bubblewrap build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tat-cloud-manager-apk
          path: twa/app/build/outputs/bundle/release/*.apk