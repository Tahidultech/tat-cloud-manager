name: Build TAT Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Android Project
        run: |
          mkdir -p android-app/app/src/main/java/com/tahidul/tatmanager
          mkdir -p android-app/app/src/main/res/values

          cat > android-app/settings.gradle <<'GRADLE'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "TATManager"
include(":app")
GRADLE

          cat > android-app/build.gradle <<'GRADLE'
plugins {
    id 'com.android.application' version '8.7.3' apply false
}
GRADLE

          cat > android-app/gradle.properties <<'GRADLE'
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
GRADLE

          cat > android-app/app/build.gradle <<'GRADLE'
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tahidul.tatmanager'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tahidul.tatmanager'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.browser:browser:1.8.0'
}
GRADLE

          cat > android-app/app/src/main/res/values/strings.xml <<'XML'
<resources>
    <string name="app_name">TAT Cloud &amp; Accounts Manager</string>
</resources>
XML

          cat > android-app/app/src/main/res/values/styles.xml <<'XML'
<resources>
    <style name="AppTheme"
        parent="android:style/Theme.Material.Light.NoActionBar"/>
</resources>
XML

          cat > android-app/app/src/main/AndroidManifest.xml <<'XML'
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">

    <uses-permission android:name="android.permission.INTERNET"/>

    <application
        android:theme="@style/AppTheme"
        android:label="@string/app_name">

        <activity
            android:name=".MainActivity"
            android:exported="true">

            <intent-filter>
                <action android:name="android.intent.action.MAIN"/>
                <category android:name="android.intent.category.LAUNCHER"/>
            </intent-filter>

        </activity>

    </application>
</manifest>
XML

          cat > android-app/app/src/main/java/com/tahidul/tatmanager/MainActivity.java <<'JAVA'
package com.tahidul.tatmanager;

import android.app.Activity;
import android.os.Bundle;
import android.webkit.WebView;
import android.webkit.WebViewClient;

public class MainActivity extends Activity {

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        WebView webView = new WebView(this);
        webView.setWebViewClient(new WebViewClient());

        webView.getSettings().setJavaScriptEnabled(true);
        webView.getSettings().setDomStorageEnabled(true);

        webView.loadUrl(
            "https://tahidultech.github.io/tat-cloud-manager/"
        );

        setContentView(webView);
    }
}
JAVA

      - name: Build APK
        working-directory: android-app
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TAT-Manager-APK
          path: android-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
