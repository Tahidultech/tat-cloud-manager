name: Build TAT Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: |
          npm install -g @bubblewrap/cli
          bubblewrap --version

      - name: Generate Android Project
        run: |
          rm -rf android-app
          mkdir android-app
          cd android-app

          bubblewrap init \
            --manifest=https://tahidultech.github.io/tat-cloud-manager/manifest.json \
            --directory=.

      - name: Build APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TAT-Manager-APK
          path: android-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
